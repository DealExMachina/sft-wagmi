# Catches TRL / SFTTrainer API drift before HF Docker Space deploys.
name: CI smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trl-sft-trainer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci-smoke.yml

      - name: Install CPU torch + TRL stack (no Unsloth)
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'trl>=0.18.2,<=0.24.0' 'transformers>=4.51.3' 'datasets>=3.4.1' accelerate packaging

      - name: Smoke test build_sft_trainer + one train step
        run: python scripts/smoke_trl_sft_trainer.py
