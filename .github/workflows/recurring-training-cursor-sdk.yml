name: Recurring training (Cursor SDK)

on:
  workflow_dispatch:
    inputs:
      cadence:
        description: "Run cadence"
        type: choice
        required: true
        default: daily
        options:
          - daily
          - weekly
  schedule:
    # Daily run (06:15 UTC)
    - cron: "15 6 * * *"
    # Weekly run every Monday (06:45 UTC)
    - cron: "45 6 * * 1"

jobs:
  recurring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HF CLI
        run: |
          python -m pip install -U pip
          pip install "huggingface_hub[cli]>=0.31.0"

      - name: Install Cursor SDK automation deps
        working-directory: automation/cursor-sdk
        run: npm install

      - name: Resolve cadence from trigger
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.cadence }}" >> "$GITHUB_OUTPUT"
          else
            now_dow="$(date -u +%u)"
            if [[ "$now_dow" == "1" ]]; then
              echo "value=weekly" >> "$GITHUB_OUTPUT"
            else
              echo "value=daily" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Trigger recurring runner via Cursor SDK
        working-directory: automation/cursor-sdk
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL_ID: composer-2
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run run:recurring -- \
            --cadence "${{ steps.cadence.outputs.value }}" \
            --trigger "github-actions:${{ github.run_id }}"
